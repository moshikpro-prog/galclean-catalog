:root{--bg:#0a0c10;--card:#12161d;--line:rgba(255,255,255,.12);--tx:#f4f6f9;--mut:#a7b0bf;--ac:#5ec4ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
.card{position:relative;width:100%;max-width:460px;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:clamp(8px,1.6dvh,18px);padding:max(clamp(16px,3.4dvh,34px),env(safe-area-inset-top)) 22px max(clamp(14px,2.6dvh,28px),env(safe-area-inset-bottom));overflow:hidden;text-align:center;background:radial-gradient(120% 55% at 50% 0%,rgba(94,196,255,.22),transparent 62%),radial-gradient(90% 40% at 50% 100%,rgba(94,196,255,.10),transparent 70%),var(--bg)}
.brand{direction:ltr;line-height:1}
.wm{font-size:clamp(40px,10.5dvh,58px);font-weight:400;letter-spacing:-1.5px}.wm b{font-weight:800;color:var(--ac)}
.sub{font-size:clamp(8px,1.5dvh,10.5px);letter-spacing:.34em;color:var(--mut);margin-top:8px;padding-left:.34em}
.hl{font-size:clamp(17px,3dvh,22px);font-weight:700;line-height:1.25;max-width:19em;text-wrap:balance}.hl em{font-style:normal;color:var(--ac)}
.qr{width:min(62vw,36dvh,260px);aspect-ratio:1;background:#fff;border-radius:22px;padding:clamp(12px,2.2dvh,18px);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 44px rgba(0,0,0,.55),0 0 60px rgba(94,196,255,.18);flex:none}
.qr svg{display:block;width:100%;height:100%}
.cap{font-size:clamp(12px,1.9dvh,14px);color:var(--mut);margin-top:-2px}.cap b{color:var(--tx);font-weight:700}
