ight="bold">DI מעורב</text><text x="177.00" y="76.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">יעד ≤5 ppm</text><line x1="151.000" y1="72.000" x2="139.500" y2="72.000" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="87" y="60" width="52" height="24" rx="1.5" fill="#f4f6f8" stroke="#111" stroke-width="0.4"/><text x="113.00" y="70.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">מיכל אגירה</text><text x="113.00" y="76.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">10–20 ל', אטמוספרי, מצוף</text><rect x="87" y="125" width="52" height="24" rx="1.5" fill="#f4f6f8" stroke="#111" stroke-width="0.4"/><text x="113.00" y="135.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">משאבה 24V</text><text x="113.00" y="141.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">ממברנה, מתג לחץ</text><line x1="139.000" y1="137.000" x2="150.500" y2="137.000" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="151" y="125" width="52" height="24" rx="1.5" fill="#f4f6f8" stroke="#111" stroke-width="0.4"/><text x="177.00" y="135.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">מסנן 50 µm</text><text x="177.00" y="141.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">הגנת פיות</text><line x1="203.000" y1="137.000" x2="214.500" y2="137.000" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="215" y="125" width="52" height="24" rx="1.5" fill="#f4f6f8" stroke="#111" stroke-width="0.4"/><text x="241.00" y="135.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">ווסת ספיקה</text><text x="241.00" y="141.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">2 ל'/דק' קבוע</text><line x1="267.000" y1="137.000" x2="278.500" y2="137.000" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="279" y="125" width="52" height="24" rx="1.5" fill="#f4f6f8" stroke="#111" stroke-width="0.4"/><text x="305.00" y="135.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">ברז סולנואיד</text><text x="305.00" y="141.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">24V DC, NC</text><line x1="331.000" y1="137.000" x2="342.500" y2="137.000" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="343" y="125" width="52" height="24" rx="1.5" fill="#e3f0fb" stroke="#111" stroke-width="0.4"/><text x="369.00" y="135.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">מסילה</text><text x="369.00" y="141.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">101 פיות Ø0.5</text><line x1="113.000" y1="84.000" x2="113.000" y2="124.500" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><text x="369.00" y="96.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.5" text-anchor="middle" fill="#666" font-weight="normal">תרכיז RO → ניקוז</text><text x="369.00" y="160.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.5" text-anchor="middle" fill="#666" font-weight="normal">מי השטיפה → ניקוז המקלחת</text><text x="395.00" y="50.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="end" fill="#666" font-weight="normal">מסלול מים: שורה עליונה מימין לשמאל, ואז שורה תחתונה משמאל לימין</text><rect x="150" y="180" width="70" height="26" rx="1.5" fill="#fff7e6" stroke="#111" stroke-width="0.4"/><text x="185.00" y="191.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">בקר</text><text x="185.00" y="197.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">לחצן IPX7 / חיישן · טיימר 30–90 ש' · דופק פתיחה</text><rect x="235" y="180" width="70" height="26" rx="1.5" fill="#fff7e6" stroke="#111" stroke-width="0.4"/><text x="270.00" y="191.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">חיישן נזילה + מד TDS</text><text x="270.00" y="197.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">בארון השירות, ניתוק אוטומטי</text><path d="M113.0,149 L113.0,193 L150,193" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><path d="M305.0,149 L305.0,170 L185,170 L185,180" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><path d="M235,193 L220,193" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><text x="405.00" y="216.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• ייצור RO ביתי טיפוסי (50–100 GPD) ≈ 0.13–0.26 ל'/דק' – לא מספיק לזרימה ישירה של 2 ל'/דק'. לכן נדרש מיכל, או RO ישיר 600+ GPD.</text><text x="405.00" y="221.60" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• מיכל RO מוגז (פרסוסטט) מספק לחץ דועך 2.8→0.3 bar – ווסת ספיקה קבועה דורש ~1 bar; לכן מומלץ מיכל אטמוספרי + משאבה.</text><text x="405.00" y="227.20" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• צריכה לשטיפה: 1.5–2 ל' (45–60 ש' ב-2 ל'/דק'). עם RO בניצולת 25–50% – 3–8 ל' מי רשת לשטיפה.</text><text x="405.00" y="232.80" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• DI מעורב אחרי RO: מוריד ל-<5 ppm; צפי חיי שרף ~8 חודשים לליטר שרף ב-4 ל'/יום (תלוי TDS – לאמת בניסוי).</text><text x="405.00" y="238.40" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• חשמל: 24V DC SELV בלבד באזורי האמבטיה; ספק כוח וכל רכיב 230V מחוץ לאזורים, לפי IEC 60364-7-701 ותקנות מקומיות.</text><text x="405.00" y="244.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• צינור הזנה 3/8" (ID 6.4): מפל ~11 kPa ל-4 מ' ב-2 ל'/דק'. צינור 1/4" מפיל 75 kPa – לא מומלץ.</text><text x="405.00" y="249.60" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• לחץ עבודה במסילה: ~3.4 kPa (2 ל'/דק') עד ~14 kPa (4 ל'/דק'). המסילה אינה כלי לחץ; הסעפת נבדקת ל-1 bar.</text><rect x="10" y="10" width="400" height="277" fill="none" stroke="#111" stroke-width="0.7"/><rect x="260" y="259" width="150" height="28" fill="#fff" stroke="#111" stroke-width="0.5"/><line x1="260.000" y1="269.000" x2="410.000" y2="269.000" stroke="#111" stroke-width="0.3"/><line x1="260.000" y1="278.000" x2="410.000" y2="278.000" stroke="#111" stroke-width="0.3"/><line x1="360.000" y1="269.000" x2="360.000" y2="287.000" stroke="#111" stroke-width="0.3"/><text x="407.00" y="266.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="4.2" text-anchor="end" fill="#111" font-weight="bold">סכמת מערכת – טיהור, הזנה ובקרה</text><text x="357.00" y="275.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">מסילת שטיפה עצמית לזכוכית מקלחון – קונספט C (סעפת לחץ + סדק נימי)</text><text x="357.00" y="284.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">מידות במ"מ · זכוכית בסיס 8 מ"מ · טיוטה לאימות בניסוי – לא לייצור</text><text x="385.00" y="275.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="middle" fill="#111" font-weight="normal">גיליון 5/5</text><text x="385.00" y="284.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="middle" fill="#111" font-weight="normal">סכמטי</text></svg>