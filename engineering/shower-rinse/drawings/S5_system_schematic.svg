.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">24V DC, NC</text><line x1="77.000" y1="160.000" x2="77.000" y2="120.500" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><rect x="56" y="92" width="42" height="28" rx="1.5" fill="#e3f0fb" stroke="#111" stroke-width="0.4"/><text x="77.00" y="103.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">מסילה – אזור 3</text><text x="77.00" y="108.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">אופציונלי</text><line x1="77.000" y1="200.000" x2="77.000" y2="190.500" stroke="#1f6fd1" stroke-width="0.6" marker-end="url(#flow)"/><text x="128.00" y="84.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="middle" fill="#111" font-weight="normal">המסילות מותקנות על השפה העליונה של כל דופן זכוכית, סביב המקלחון</text><path d="M290,129 L240,129 L240,152 L60,152" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><line x1="210.000" y1="152.000" x2="210.000" y2="160.000" stroke="#ef6c00" stroke-width="0.4" stroke-dasharray="2 1"/><line x1="150.000" y1="152.000" x2="150.000" y2="160.000" stroke="#ef6c00" stroke-width="0.4" stroke-dasharray="2 1"/><line x1="90.000" y1="152.000" x2="90.000" y2="160.000" stroke="#ef6c00" stroke-width="0.4" stroke-dasharray="2 1"/><path d="M290,135 L250,135" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><rect x="20" y="60" width="60" height="20" rx="1.5" fill="#fff7e6" stroke="#111" stroke-width="0.4"/><text x="50.00" y="67.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">לחצן IPX7 ליד המקלחון</text><text x="50.00" y="72.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.4" text-anchor="middle" fill="#111" font-weight="normal">או הפעלה אוטומטית</text><path d="M80,70 L100,70 L100,42 L300,42 L300,115" stroke="#ef6c00" stroke-width="0.4" fill="none" stroke-dasharray="2 1"/><text x="405.00" y="216.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• מקור המים: מכשיר GalClean קיים בזרימה ישירה, ללא מיכל. הספיקה נקבעת ע"י הממברנה; מפל הלחץ במסילה (~3.4 kPa) זניח מולה.</text><text x="405.00" y="222.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• כשהספיקה אינה מספיקה לכל הדפנות בבת אחת – שטיפה לפי אזורים: כל דופן מקבלת את מלוא הספיקה בתורה (45 ש' לאזור).</text><text x="405.00" y="228.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• צינור אחיד לכל הדגמים: 198×Ø0.35 בפסיעה 5 מ"מ מתאים ל-1.5–4 ל'/דק'/מ' (מפל 2–15 kPa).</text><text x="405.00" y="234.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• ספיקת RO יורדת בחורף (מים קרים) בכ-25% – יש לתכנן לפי ספיקת חורף ולאמת מול נתוני היצרן.</text><text x="405.00" y="240.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• יש לוודא את אופן ההפעלה של משאבת המכשיר (מתג לחץ אוטומטי או מתג ידני) – קובע אם מספיק ברז סולנואיד או נדרש גם ממסר.</text><text x="405.00" y="246.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">• חשמל: 24V DC (SELV) בלבד באזורי האמבטיה; 230V רק בתא, לפי IEC 60364-7-701 ותקנות מקומיות. צינור הזנה 3/8".</text><rect x="10" y="10" width="400" height="277" fill="none" stroke="#111" stroke-width="0.7"/><rect x="260" y="259" width="150" height="28" fill="#fff" stroke="#111" stroke-width="0.5"/><line x1="260.000" y1="269.000" x2="410.000" y2="269.000" stroke="#111" stroke-width="0.3"/><line x1="260.000" y1="278.000" x2="410.000" y2="278.000" stroke="#111" stroke-width="0.3"/><line x1="360.000" y1="269.000" x2="360.000" y2="287.000" stroke="#111" stroke-width="0.3"/><text x="407.00" y="266.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="4.2" text-anchor="end" fill="#111" font-weight="bold">סכמת מערכת – GalClean ומסילות</text><text x="357.00" y="275.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">מסילת שטיפה עצמית לזכוכית מקלחון – קונספט C (סעפת לחץ + סדק נימי)</text><text x="357.00" y="284.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="end" fill="#111" font-weight="normal">מידות במ"מ · זכוכית בסיס 8 מ"מ · גרסה 0.3 · טיוטה לאימות בניסוי – לא לייצור</text><text x="385.00" y="275.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="middle" fill="#111" font-weight="normal">גיליון 5/5</text><text x="385.00" y="284.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.8" text-anchor="middle" fill="#111" font-weight="normal">סכמטי</text></svg>