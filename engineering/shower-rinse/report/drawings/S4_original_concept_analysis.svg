le" fill="#111" font-weight="normal" transform="rotate(-90.0 112.60 78.51)">h≈0.7 מ"מ</text><line x1="80.000" y1="119.000" x2="80.000" y2="128.200" stroke="#666" stroke-width="0.15"/><line x1="84.800" y1="119.000" x2="84.800" y2="128.200" stroke="#666" stroke-width="0.15"/><line x1="80.000" y1="127.000" x2="84.800" y2="127.000" stroke="#111" stroke-width="0.18" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="82.40" y="129.31" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.6" text-anchor="middle" fill="#111" font-weight="normal">מרווח</text><text x="130.00" y="30.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.8" text-anchor="middle" fill="#111" font-weight="bold">קונספט מקורי (סכמטי)</text><text x="405.00" y="150.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.6" text-anchor="end" fill="#111" font-weight="bold">ממצאים – מדוע הקונספט הוחלף בעקרון מבוסס לחץ</text><text x="405.00" y="159.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">1. עומד הגלישה ב-2 ל'/דק'/מ' הוא כ-0.69 מ"מ (1.1 מ"מ ב-4 ל'/דק'): קטן פי 4 מאורך הנימיות (2.7 מ"מ).</text><text x="405.00" y="166.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">2. ספיקה מקומית ∝ h^1.5: לאחידות ±10% נדרש פילוס הסף ±0.05 מ"מ לאורך מטר – לא בר־השגה בהתקנה ביתית.</text><text x="405.00" y="174.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">3. הטיה של 1 מ"מ/מ' → קצה אחד מקבל פי ~20 יותר מים מהשני; 2 מ"מ/מ' → כרבע מהאורך יבש.</text><text x="405.00" y="181.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">4. מתח פנים וזווית מגע מקבעים את הגלישה בנקודה הנמוכה ביותר → פסים במקום יריעה (דורש אימות, אך צפוי).</text><text x="405.00" y="189.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">5. סבולות: ישרות אקסטרוזיה סטנדרטית ~1 מ"מ/מ'; התפשטות PETG ~1.4 מ"מ ב-ΔT=20°; זכוכית מחוסמת – קשת עד 3 מ"מ/מ'.</text><text x="405.00" y="196.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">6. מרווח קבוע 'קרוב מאוד לזכוכית' אינו נשמר בגלל קשת הזכוכית; שפה קשיחה עלולה לגעת/להתרחק מקומית.</text><text x="405.00" y="204.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">7. מים עומדים בתא אחרי כל שימוש (≈100–150 מ"ל) – סיכון לביופילם ולמשקעים דווקא על קו הסף.</text><text x="405.00" y="211.50" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="2.75" text-anchor="end" fill="#111" font-weight="normal">8. משטח משופע (לא אנכי) מאט ומעבה את הזרם ונוטה לאי-יציבות 'אצבעות' של קו המגע – אינו מאחד פסים.</text><rect x="250" y="35" width="150" height="85" fill="#fafafa" stroke="#111" stroke-width="0.3"/><text x="325.00" y="31.00" font-family="Arial, 'Noto Sans Hebrew', 'DejaVu Sans', sans-serif" font-size="3.0" text-anchor="middle" fill="#111" font-weight="bold">פיזור ספיקה (מקס'/מינ') כפונקציה של הטיית המסילה – 2 ל'/דק'/מ'</text><path d="M250.00,120.00 L252.50,117.64 L255.00,115.27 L257.50,112.89 L260.00,110.49 L262.50,108.06 L265.00,105.60 L267.50,103.10 L270.00,100.55 L272.50,97.94 L275.00,95.26 L277.50,92.50 L280.00,89.64 L282.50,86.67 L285.00,83.56 L287.50,80.30 L290.00,76.85 L292.50,73.17 L295.00,69.22 L297.50,64.93 L300.00,60.20 L302.50,54.93 L305.00,48.91 L307.50,41.85 L310.00,35.00 L312.50,35.00 L315.00,35.00 L317.50,35.00 L320.00,35.00 L322.50,35.00 L325.00,35.00 L327.50,35.00 L330.00,35.00 L332.50,35.00 L335.00,35.00 L337.50,35.00 L340.00,35.00 L342.50,35.00